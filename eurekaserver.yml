server:
  port: 8761

eureka:
  instance:
    hostname: ${SPRING_EUREKA_SERVICE_URL:localhost}

  client:
    register-with-eureka: false    # ✅ FIX: Server doesn't register itself
    fetch-registry: false          # ✅ FIX: Server doesn't fetch registry
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
